name: Synchronize from PyPI

on:
  workflow_dispatch:
  schedule:
    # Run at 12:00 (Asia/Shanghai UTC+8) on Monday/Wednesday/Friday
    - cron: "0 4 * * 1,3,5"

permissions:
  contents: write

concurrency:
  group: sync-from-pypi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Synchronize from PyPI
        run: bash .github/workflows/sync.sh

      - name: Push release commits and tags
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: git push --atomic --tags origin "HEAD:${GITHUB_REF}"
